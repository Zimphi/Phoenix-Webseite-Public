name: Publish only Phoenix 404

on:
  workflow_dispatch:
    inputs:
      publish_404:
        description: Publish only the separately approved 404 holding page
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.publish_404 && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require explicit holding-page approval
        run: |
          python3 - <<'PYTHON'
          import json
          config = json.load(open('publication.json'))
          if config.get('holdingPublicationApproved') is not True:
              raise SystemExit('404 publication has not been approved')
          PYTHON
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Assemble only the four approved public files
        run: |
          mkdir _site
          cp index.html 404.html fdroid.css phoenix.png _site/
          cmp _site/index.html _site/404.html
          python3 - <<'PYTHON'
          from pathlib import Path
          expected = {'index.html', '404.html', 'fdroid.css', 'phoenix.png'}
          actual = {p.name for p in Path('_site').iterdir()}
          if actual != expected or any(p.is_symlink() for p in Path('_site').iterdir()):
              raise SystemExit('Refusing to publish anything except the approved 404 files')
          PYTHON
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy only the 404 holding page
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
